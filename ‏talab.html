<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب خدمة - Digital Eye</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{background:white;padding:20px;border-radius:12px;max-width:400px;margin:auto}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:#000;color:white;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>Digital Eye - طلب خدمة</h2>
<input id="nom" placeholder="الاسم">
<input id="tel" placeholder="رقم الهاتف">
<select id="service">
<option>تصميم موقع</option>
<option>تصميم تطبيق</option>
<option>خدمة رقمية أخرى</option>
</select>
<button onclick="send()">اطلب الآن</button>
<p id="msg"></p>
</div>

<script>
const supabaseClient = supabase.createClient(
  'https://txyaplmxsfvhqztkgesg.supabase.co',
  'sb_publishable_bi3B6opJuNEhZIm6kUCeVA_QLdDynxj'
);

async function send(){
  const nom = document.getElementById('nom').value;
  const telephone = document.getElementById('tel').value;
  const service = document.getElementById('service').value;
  
  if(!nom || !telephone){ 
    document.getElementById('msg').innerText='عمر المعلومات'; 
    return;
  }

  const { error } = await supabaseClient.from('demandes').insert({ nom, telephone, service });
  
  if(error){
    document.getElementById('msg').innerText='خطأ: '+error.message;
  } else {
    document.getElementById('msg').innerText='✅ تم تسجيل طلبك بنجاح!';
    document.getElementById('nom').value='';
    document.getElementById('tel').value='';
  }
}
</script>
</body>
</html>
