<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة - Digital Eye</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:Arial;padding:20px">
<input id="nom" placeholder="اسمك" style="width:100%;padding:10px;margin:5px 0">
<input id="tel" placeholder="هاتفك" style="width:100%;padding:10px;margin:5px 0">
<textarea id="msgText" placeholder="اكتب رسالتك هنا" style="width:100%;padding:10px;height:100px"></textarea>
<button onclick="sendMsg()" style="width:100%;padding:12px;background:black;color:white">إرسال الرسالة</button>
<p id="status"></p>

<script>
const supabaseClient = supabase.createClient(
  'https://txyaplmxsfvhqztkgesg.supabase.co',
  'sb_publishable_bi3B6opJuNEhZIm6kUCeVA_QLdDynxj'
);
async function sendMsg(){
  const { error } = await supabaseClient.from('messages').insert({
    nom: document.getElementById('nom').value,
    telephone: document.getElementById('tel').value,
    message: document.getElementById('msgText').value
  });
  document.getElementById('status').innerText = error ? 'خطأ: '+error.message : '✅ تم إرسال الرسالة وتسجلت في قاعدة البيانات!';
}
</script>
</body>
</html>
